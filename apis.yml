name: Canary
description: Canary is an AI QA engineer that reads your source code to understand developer
  intent. Push a pull request and Canary reads the diff, understands the intent, and runs
  feature and regression tests against your preview app across real browsers, catching broken
  auth flows, slow page loads, and failing checkouts before they reach production. Built by
  ex-Google, Windsurf, and Cognition engineers, Canary is a Y Combinator Winter 2026 company
  positioned as the validation layer for AI-generated code.
